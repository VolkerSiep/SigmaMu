datasets:
  washburn_h2o: {} # external file
  washburn_all: {} # external file

evaluations:
  pure_h2o:
    dataset_id: washburn_h2o
    model_id: p_sat
    data_to_model:
       T: {path: [T]}
       w: {path: [w]}
       p: {path: [p_meas]}
    quote_data:
      T: {name: T, uom: degC}
      p_meas: {name: p, uom: bar}
    properties:
      p_calc: {path: [p_calc], uom: bar}
  all:
    dataset_id: washburn_all
    model_id: p_sat
    data_to_model:
       T: {path: [T]}
       w: {path: [w]}
       p: {path: [p_meas]}
    quote_data:
      T: {name: T, uom: degC}
      w_nacl: {name: w, uom: "%"}
      p_meas: {name: p, uom: bar}
    properties:
      p_calc: {path: [p_calc], uom: bar}

contributions:
  p_sat:
    dataset_id: washburn_all
    model_id: p_sat
    data_to_model:
      T: { path: [T] }
      w: { path: [w] }
      p: { path: [p_meas] }
    penalties:
      - [q]

parameters:
  b1:
    path: [PitzerBinaryInteraction, beta_01, Na+, Cl-]
  b2:
    path: [PitzerBinaryInteraction, beta_02, Na+, Cl-]
