datasets:
  wiki_data:
    source: Wikipedia, entry on tin
    columns: [T_trans]
    uom: [degC]
    data:
      - [12.0]  # 12.3, but let's pretend we measure twice like this
#      - [12.1]
#      - [12.2]  # 12.3, but let's pretend we measure twice like this
#      - [12.3]
#      - [12.4]  # 12.3, but let's pretend we measure twice like this
#      - [12.5]
#      - [12.6]

contributions:
  equilibrium:
    dataset: wiki_data
    model_id: transition_model
    data_to_model:
      T_trans: {path: [T_measured]}
    penalties:
      - [dT_norm]

parameters:
  s_0:
    path: [H0S0ReferenceState, s_0, a-Sn]

