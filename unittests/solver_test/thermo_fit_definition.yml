datasets:
  vle:
    source: fictive
    columns: [ T, p, x, y ]
    uom: [degC, bar, "%", "%"]
    data:
      - [ 100, 1, 20, 40 ]
      - [ 110, 1, 30, 50 ]
      - [ 120, 1, 40, 60 ]
      - [ 130, 1, 50, 70 ]
      - [ 140, 1, 60, 80 ]
contributions:
  vle:
    dataset: vle
    model_id: vle_fit
    data_to_model:
      T: process.T
      p: process.p
      x: process.x
      y: process.y
    penalties:
      process.dmu_norm/H2O
      process.dmu_norm/CO2
evaluations:
  vle_p:
    dataset: vle
    model_id: vle_eval_p
    data_to_model:
      T: process.T
      x: process.x
    properties:
      p_hat:
        name: process.p
        uom: bar
      y_hat:
        name: process.y
        uom: "%"

